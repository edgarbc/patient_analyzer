name: CI

on:
  push:
    branches: [main, "portfolio/**", "copilot/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run smoke tests
        run: |
          python -m pytest tests/smoke_test.py -v

      - name: Verify demo imports
        run: |
          python -c "from demo.app import load_patient_data, compute_tfidf_embeddings, find_nearest_neighbors; print('Demo imports successful!')"
